name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Never run CI for Dependabot PRs (actor blocks the initial run; pull_request
    # author keeps it skipped even if a human re-runs or pushes to the branch).
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dev deps
        run: pip install ruff pytest pyyaml

      - name: Lint
        run: ruff check skills/b2-cloud-storage/scripts tests

      - name: Test
        run: pytest tests/ -v

      - name: Validate SKILL.md frontmatter
        run: python tests/validate_frontmatter.py skills/b2-cloud-storage/SKILL.md
