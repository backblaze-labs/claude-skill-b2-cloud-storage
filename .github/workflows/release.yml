name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify tag matches in-tree version
        run: python scripts/check_version.py "${{ github.ref_name }}"

      - name: Build artifacts
        run: python scripts/build_artifacts.py "${{ github.ref_name }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::error::No release artifacts found in dist/"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --generate-notes --title "${GITHUB_REF_NAME}"
